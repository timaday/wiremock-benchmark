# Generated by render.py with an explicit registry lock.
version: '3.8'
services:
  official:
    image: ghcr.io/timaday/wiremock-lab-official@sha256:ba89ff55533c0747ed98b3f204e96ee8db4a339404e6757ce38bd07d6d45dd8b
    deploy:
      replicas: ${OFFICIAL_REPLICAS:?set 0 or 1}
      placement:
        constraints:
        - node.hostname == ${OFFICIAL_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: none
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-true}
      OUTBOX_PATH: /state/outbox.db
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?required}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:file=/state/gc.log:time,level,tags
      WIREMOCK_ACCEPT_BACKLOG: ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
    ports:
    - target: 8080
      published: ${OFFICIAL_PORT:-19080}
      protocol: tcp
      mode: ingress
    volumes:
    - official-outbox:/state
    stop_grace_period: 45s
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
    - --port
    - '8080'
    - --no-request-journal
    - --disable-request-logging
    - --container-threads
    - '128'
    - --jetty-accept-queue-size
    - ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
    - --async-response-enabled
    - 'true'
    - --async-response-threads
    - '64'
    - --disable-gzip
    - --disable-http2-plain
    - --disable-http2-tls
    - --max-template-cache-entries
    - '1000'
    - --extensions
    - bench.CaptureExtension
  official-archive:
