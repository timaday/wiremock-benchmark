# Generated by render.py; official WireMock, capture disabled, no persistent storage.
version: '3.8'
services:
  official:
    image: ghcr.io/timaday/wiremock-lab-official@sha256:6a078e6f5ea3cc1cdd204c2807989cad33c081943033b2e6d1ef88f9db1a0c18
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      CAPTURE_ENABLED: 'false'
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:time,level,tags
      WIREMOCK_ACCEPT_BACKLOG: ${WIREMOCK_ACCEPT_BACKLOG:-4096}
    ports:
      - target: 8080
        published: ${OFFICIAL_PORT:-19480}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - --port
      - '8080'
      - --no-request-journal
      - --disable-request-logging
      - --container-threads
      - '128'
      - --jetty-accept-queue-size
      - ${WIREMOCK_ACCEPT_BACKLOG:-4096}
      - --async-response-enabled
      - 'true'
      - --async-response-threads
      - '64'
      - --disable-gzip
      - --disable-http2-plain
      - --disable-http2-tls
      - --max-template-cache-entries
      - '1000'
      - --extensions
      - bench.CaptureExtension
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
