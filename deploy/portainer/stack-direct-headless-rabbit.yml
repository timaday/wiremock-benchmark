# Generated by render.py; direct capture with dedicated RabbitMQ and archive.
version: '3.8'
services:
  headless:
    image: ghcr.io/timaday/wiremock-lab-headless@sha256:1fed1c931c3dfeceb6fd117a337883c853867bc4ab88d0f42f34770c26225562
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      CAPTURE_MODE: DIRECT_RABBIT
      CAPTURE_ENABLED: 'true'
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?set generated hexadecimal password}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.headless
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:time,level,tags
      WIREMOCK_ACCEPT_BACKLOG: ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
      CAPTURE_IDENTITY_MODE: ${CAPTURE_IDENTITY_MODE:?set BENCHMARK_HEADERS or STUB_JSON}
      RABBIT_QUEUE_TYPE: classic
      CAPTURE_CONFIRM_TIMEOUT_MS: ${CAPTURE_CONFIRM_TIMEOUT_MS:?set positive confirmation
        deadline}
    ports:
      - target: 8080
        published: ${HEADLESS_PORT:-19081}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  rabbit:
    image: ghcr.io/timaday/wiremock-lab-rabbit@sha256:809e8845798216d8c484505544628e07d63ba188a07ac3ae24a3e98d2ef52890
    hostname: rabbit
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set generated hexadecimal password}
      CAPTURE_QUEUE_MAX_BYTES: ${CAPTURE_QUEUE_MAX_BYTES:?required}
      CAPTURE_QUEUE_MAX_MESSAGES: ${CAPTURE_QUEUE_MAX_MESSAGES:?required}
      RABBIT_DISK_FREE_LIMIT_BYTES: ${RABBIT_DISK_FREE_LIMIT_BYTES:?required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        #!/bin/sh
        # Own dedicated-broker boot configuration; never modify or delete broker data.
        set -eu
        case "$${RABBIT_PASSWORD:?required}" in
          *[!a-fA-F0-9]*) echo 'RABBIT_PASSWORD must be hexadecimal' >&2; exit 1 ;;
        esac
        if [ "$${#RABBIT_PASSWORD}" -lt 32 ] || [ "$${#RABBIT_PASSWORD}" -gt 128 ]; then
          echo 'RABBIT_PASSWORD must contain 32-128 hexadecimal characters' >&2
          exit 1
        fi
        for value in "$${CAPTURE_QUEUE_MAX_BYTES:?required}" \
                     "$${CAPTURE_QUEUE_MAX_MESSAGES:?required}" \
                     "$${RABBIT_DISK_FREE_LIMIT_BYTES:?required}"; do
          case "$$value" in
            ''|0*|*[!0-9]*) echo 'Broker limits must be positive decimal integers' >&2; exit 1 ;;
          esac
        done
        umask 077
        mkdir -p /tmp/benchmark-config
        chmod 755 /tmp/benchmark-config
        cat > /tmp/benchmark-config/definitions.json <<EOF
        {
          "users": [{"name":"benchmark","password":"$$RABBIT_PASSWORD","tags":["administrator"]}],
          "vhosts": [{"name":"/"}],
          "permissions": [{"user":"benchmark","vhost":"/","configure":".*","write":".*","read":".*"}],
          "policies": [{"vhost":"/","name":"capture-bounds","pattern":".*","apply-to":"queues","priority":100,
            "definition":{"max-length-bytes":$$CAPTURE_QUEUE_MAX_BYTES,"max-length":$$CAPTURE_QUEUE_MAX_MESSAGES,"overflow":"reject-publish"}}]
        }
        EOF
        cat > /tmp/benchmark-config/rabbitmq.conf <<EOF
        listeners.tcp.default = 5672
        management.tcp.port = 15672
        default_queue_type = classic
        definitions.import_backend = local_filesystem
        definitions.local.path = /tmp/benchmark-config/definitions.json
        disk_free_limit.absolute = $$RABBIT_DISK_FREE_LIMIT_BYTES
        vm_memory_high_watermark.absolute = 1GB
        EOF
        chown rabbitmq:rabbitmq /tmp/benchmark-config/definitions.json /tmp/benchmark-config/rabbitmq.conf
        export RABBITMQ_CONFIG_FILE=/tmp/benchmark-config/rabbitmq
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - type: bind
        source: ${RABBIT_DATA_DIR:?set existing local broker directory}
        target: /var/lib/rabbitmq
    ports:
      - target: 15672
        published: ${RABBIT_UI_PORT:-15675}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${RABBIT_NODE:?set storage node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 120s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  archive:
    image: ghcr.io/timaday/wiremock-lab-archive@sha256:f9ec079bb167b4ed095c9a56f70e805c7e8794408b81d7ae864ebfb2897cd596
    environment:
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?set generated hexadecimal password}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.headless
      ARCHIVE_PATH: /archive/events.db
      JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError
    volumes:
      - type: bind
        source: ${ARCHIVE_DATA_DIR:?set existing local archive directory}
        target: /archive
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /archive/events.db && test -w /archive/events.db
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${ARCHIVE_NODE:?set storage node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 60s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  capture:
    driver: overlay
