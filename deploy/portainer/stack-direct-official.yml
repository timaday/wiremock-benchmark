# Generated by render.py; requires the new direct capture image.
version: '3.8'
services:
  official:
    image: ${OFFICIAL_DIRECT_IMAGE:?set newly built direct capture image}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      CAPTURE_MODE: DIRECT_RABBIT
      CAPTURE_ENABLED: 'true'
      RABBIT_URI: ${POCKETHIVE_RABBIT_URI:?set reachable PocketHive RabbitMQ URI}
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:time,level,tags
      WIREMOCK_ACCEPT_BACKLOG: ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
      RABBIT_QUEUE_TYPE: ${RABBIT_QUEUE_TYPE:?set classic or quorum}
      CAPTURE_CONFIRM_TIMEOUT_MS: ${CAPTURE_CONFIRM_TIMEOUT_MS:?set positive confirmation
        deadline}
    ports:
      - target: 8080
        published: ${OFFICIAL_PORT:-19080}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - --port
      - '8080'
      - --no-request-journal
      - --disable-request-logging
      - --container-threads
      - '128'
      - --jetty-accept-queue-size
      - ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
      - --async-response-enabled
      - 'true'
      - --async-response-threads
      - '64'
      - --disable-gzip
      - --disable-http2-plain
      - --disable-http2-tls
      - --max-template-cache-entries
      - '1000'
      - --extensions
      - bench.CaptureExtension
    read_only: true
    networks:
      - pockethive
networks:
  pockethive:
    external: true
    name: ${POCKETHIVE_NETWORK:?set existing PocketHive overlay network}
