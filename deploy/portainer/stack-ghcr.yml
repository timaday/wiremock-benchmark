version: '3.8'
services:
  official:
    image: ghcr.io/timaday/wiremock-lab-official@sha256:2854b2dea03175f2e548d68ebb6443248fc367657ec1356d68d03294685abf88
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: none
    environment:
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-true}
      OUTBOX_PATH: /state/outbox.db
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?required}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:file=/state/gc.log:time,level,tags
    ports:
    - target: 8080
      published: ${OFFICIAL_PORT:-19080}
      protocol: tcp
      mode: ingress
    volumes:
    - official-outbox:/state
    stop_grace_period: 45s
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
    - --port
    - '8080'
    - --no-request-journal
    - --disable-request-logging
    - --container-threads
    - '128'
    - --async-response-enabled
    - 'true'
    - --async-response-threads
    - '64'
    - --disable-gzip
    - --disable-http2-plain
    - --disable-http2-tls
    - --max-template-cache-entries
    - '1000'
    - --extensions
    - bench.CaptureExtension
  official-archive:
    image: ghcr.io/timaday/wiremock-lab-archive@sha256:7de1ee0bb9870be4195058fec0ee3958fd98665c45e2c1f7c8eeb3ce506697ed
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 768M
      restart_policy:
        condition: none
    environment:
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?required}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      ARCHIVE_PATH: /archive/events.db
    volumes:
    - official-archive:/archive
    stop_grace_period: 45s
  headless:
    image: ghcr.io/timaday/wiremock-lab-headless@sha256:e6de2e9fe26bef4d9afb8a0343c7696d48e45afbb5036c60f46a3ac5e706556c
    deploy:
      replicas: 1
      placement:
