global:
  scrape_interval: 5s
  scrape_timeout: 4s
scrape_configs:
- job_name: wiremock
  metrics_path: /prometheus
  static_configs:
  - targets:
    - official:8081
    labels:
      runtime: official
  - targets:
    - headless:8081
    labels:
      runtime: headless
- job_name: rabbit
  metrics_path: /metrics/detailed
  params:
    family:
    - queue_coarse_metrics
    - queue_consumer_count
  static_configs:
  - targets:
    - rabbit:15692
