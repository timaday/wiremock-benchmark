# Generated by render.py with an explicit registry lock.
version: '3.8'
services:
  official:
    image: ghcr.io/timaday/wiremock-lab-official@sha256:ba89ff55533c0747ed98b3f204e96ee8db4a339404e6757ce38bd07d6d45dd8b
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: none
    environment:
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-true}
      OUTBOX_PATH: /state/outbox.db
      RABBIT_URI: ${POCKETHIVE_RABBIT_URI:?set reachable PocketHive RabbitMQ URI}
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:file=/state/gc.log:time,level,tags
    ports:
    - target: 8080
      published: ${OFFICIAL_PORT:-19080}
      protocol: tcp
      mode: ingress
    volumes:
    - official-outbox:/state
    stop_grace_period: 45s
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
    - --port
    - '8080'
    - --no-request-journal
    - --disable-request-logging
    - --container-threads
    - '128'
    - --async-response-enabled
    - 'true'
    - --async-response-threads
    - '64'
    - --disable-gzip
    - --disable-http2-plain
    - --disable-http2-tls
    - --max-template-cache-entries
    - '1000'
    - --extensions
    - bench.CaptureExtension
  official-archive:
    image: ghcr.io/timaday/wiremock-lab-archive@sha256:7de1ee0bb9870be4195058fec0ee3958fd98665c45e2c1f7c8eeb3ce506697ed
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 768M
      restart_policy:
        condition: none
    environment:
      RABBIT_URI: ${POCKETHIVE_RABBIT_URI:?set reachable PocketHive RabbitMQ URI}
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      ARCHIVE_PATH: /archive/events.db
    volumes:
    - official-archive:/archive
    stop_grace_period: 45s
  headless:
    image: ghcr.io/timaday/wiremock-lab-headless@sha256:e8d6a3133b26c2e30e9ee6cecf26f407869f59e55beee4928f478dd16c49f74f
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: none
    environment:
      CAPTURE_ENABLED: ${CAPTURE_ENABLED:-true}
      OUTBOX_PATH: /state/outbox.db
      RABBIT_URI: ${POCKETHIVE_RABBIT_URI:?set reachable PocketHive RabbitMQ URI}
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.headless
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:file=/state/gc.log:time,level,tags
    ports:
    - target: 8080
      published: ${HEADLESS_PORT:-19081}
      protocol: tcp
      mode: ingress
    volumes:
    - headless-outbox:/state
    stop_grace_period: 45s
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
  headless-archive:
    image: ghcr.io/timaday/wiremock-lab-archive@sha256:7de1ee0bb9870be4195058fec0ee3958fd98665c45e2c1f7c8eeb3ce506697ed
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 768M
      restart_policy:
        condition: none
    environment:
      RABBIT_URI: ${POCKETHIVE_RABBIT_URI:?set reachable PocketHive RabbitMQ URI}
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.headless
      ARCHIVE_PATH: /archive/events.db
    volumes:
    - headless-archive:/archive
    stop_grace_period: 45s
  prometheus:
    image: ghcr.io/timaday/wiremock-lab-prometheus@sha256:d673d2a0ecffb073bead7951776ab9fc6a8115a85e361981bd2f243ea0b21dff
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '1'
          memory: 768M
      restart_policy:
        condition: none
    command:
    - --config.file=/etc/prometheus/pockethive.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=7d
    - --storage.tsdb.retention.size=2GB
    ports:
    - ${PROMETHEUS_PORT:-29090}:9090
    volumes:
    - prometheus:/prometheus
  grafana:
    image: ghcr.io/timaday/wiremock-lab-grafana@sha256:b1ba4ee780745d9e19e53fcbea38ca128da3e8ce5ac28411542dc3b46f13ec35
    deploy:
      replicas: 1
      placement:
        constraints:
        - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: none
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GOMEMLIMIT: 512MiB
    ports:
    - ${GRAFANA_PORT:-13000}:3000
    volumes:
    - grafana:/var/lib/grafana
volumes:
  official-outbox: {}
  official-archive: {}
  headless-outbox: {}
  headless-archive: {}
  prometheus: {}
  grafana: {}
