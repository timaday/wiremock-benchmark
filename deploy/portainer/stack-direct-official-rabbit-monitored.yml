        exec /run.sh
    environment:
      GF_PATHS_PROVISIONING: /tmp/wiremock/provisioning
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?set Grafana username}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set Grafana password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GOMEMLIMIT: 512MiB
    volumes:
      - type: bind
        source: ${GRAFANA_DATA_DIR:?set existing local dashboard directory}
        target: /var/lib/grafana
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-13300}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:3000/api/health
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${MONITORING_NODE:?set monitoring node hostname}
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 30s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  capture:
    driver: overlay
