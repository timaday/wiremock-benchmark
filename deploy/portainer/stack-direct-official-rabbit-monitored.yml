# Generated by render.py; direct capture, RabbitMQ, archive, Prometheus and Grafana.
version: '3.8'
services:
  official:
    image: ghcr.io/timaday/wiremock-lab-official@sha256:6a078e6f5ea3cc1cdd204c2807989cad33c081943033b2e6d1ef88f9db1a0c18
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${LAB_NODE:?set Swarm node hostname}
      resources:
        limits:
          cpus: '4'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    environment:
      CAPTURE_MODE: DIRECT_RABBIT
      CAPTURE_ENABLED: 'true'
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?set generated hexadecimal password}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      FIXTURES: /home/wiremock
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx3g -XX:+ExitOnOutOfMemoryError -Xlog:gc:stdout:time,level,tags
      WIREMOCK_ACCEPT_BACKLOG: ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
      CAPTURE_IDENTITY_MODE: ${CAPTURE_IDENTITY_MODE:?set BENCHMARK_HEADERS or STUB_JSON}
      RABBIT_QUEUE_TYPE: classic
      CAPTURE_CONFIRM_TIMEOUT_MS: ${CAPTURE_CONFIRM_TIMEOUT_MS:?set positive confirmation
        deadline}
    ports:
      - target: 8080
        published: ${OFFICIAL_PORT:-19080}
        protocol: tcp
        mode: ingress
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://localhost:8080/__admin/health
      interval: 10s
      timeout: 5s
      retries: 12
    command:
      - --port
      - '8080'
      - --no-request-journal
      - --disable-request-logging
      - --container-threads
      - '128'
      - --jetty-accept-queue-size
      - ${WIREMOCK_ACCEPT_BACKLOG:?set positive accept backlog}
      - --async-response-enabled
      - 'true'
      - --async-response-threads
      - '64'
      - --disable-gzip
      - --disable-http2-plain
      - --disable-http2-tls
      - --max-template-cache-entries
      - '1000'
      - --extensions
      - bench.CaptureExtension
    read_only: true
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  rabbit:
    image: ghcr.io/timaday/wiremock-lab-rabbit@sha256:809e8845798216d8c484505544628e07d63ba188a07ac3ae24a3e98d2ef52890
    hostname: rabbit
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set generated hexadecimal password}
      CAPTURE_QUEUE_MAX_BYTES: ${CAPTURE_QUEUE_MAX_BYTES:?required}
      CAPTURE_QUEUE_MAX_MESSAGES: ${CAPTURE_QUEUE_MAX_MESSAGES:?required}
      RABBIT_DISK_FREE_LIMIT_BYTES: ${RABBIT_DISK_FREE_LIMIT_BYTES:?required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        #!/bin/sh
        # Own dedicated-broker boot configuration; never modify or delete broker data.
        set -eu
        case "$${RABBIT_PASSWORD:?required}" in
          *[!a-fA-F0-9]*) echo 'RABBIT_PASSWORD must be hexadecimal' >&2; exit 1 ;;
        esac
        if [ "$${#RABBIT_PASSWORD}" -lt 32 ] || [ "$${#RABBIT_PASSWORD}" -gt 128 ]; then
          echo 'RABBIT_PASSWORD must contain 32-128 hexadecimal characters' >&2
          exit 1
        fi
        for value in "$${CAPTURE_QUEUE_MAX_BYTES:?required}" \
                     "$${CAPTURE_QUEUE_MAX_MESSAGES:?required}" \
                     "$${RABBIT_DISK_FREE_LIMIT_BYTES:?required}"; do
          case "$$value" in
            ''|0*|*[!0-9]*) echo 'Broker limits must be positive decimal integers' >&2; exit 1 ;;
          esac
        done
        umask 077
        mkdir -p /tmp/benchmark-config
        chmod 755 /tmp/benchmark-config
        cat > /tmp/benchmark-config/definitions.json <<EOF
        {
          "users": [{"name":"benchmark","password":"$$RABBIT_PASSWORD","tags":["administrator"]}],
          "vhosts": [{"name":"/"}],
          "permissions": [{"user":"benchmark","vhost":"/","configure":".*","write":".*","read":".*"}],
          "policies": [{"vhost":"/","name":"capture-bounds","pattern":".*","apply-to":"queues","priority":100,
            "definition":{"max-length-bytes":$$CAPTURE_QUEUE_MAX_BYTES,"max-length":$$CAPTURE_QUEUE_MAX_MESSAGES,"overflow":"reject-publish"}}]
        }
        EOF
        cat > /tmp/benchmark-config/rabbitmq.conf <<EOF
        listeners.tcp.default = 5672
        management.tcp.port = 15672
        default_queue_type = classic
        definitions.import_backend = local_filesystem
        definitions.local.path = /tmp/benchmark-config/definitions.json
        disk_free_limit.absolute = $$RABBIT_DISK_FREE_LIMIT_BYTES
        vm_memory_high_watermark.absolute = 1GB
        EOF
        chown rabbitmq:rabbitmq /tmp/benchmark-config/definitions.json /tmp/benchmark-config/rabbitmq.conf
        export RABBITMQ_CONFIG_FILE=/tmp/benchmark-config/rabbitmq
        exec docker-entrypoint.sh rabbitmq-server
    volumes:
      - type: bind
        source: ${RABBIT_DATA_DIR:?set existing local broker directory}
        target: /var/lib/rabbitmq
    ports:
      - target: 15672
        published: ${RABBIT_UI_PORT:-15675}
        protocol: tcp
        mode: ingress
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${RABBIT_NODE:?set storage node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 120s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  archive:
    image: ghcr.io/timaday/wiremock-lab-archive@sha256:f9ec079bb167b4ed095c9a56f70e805c7e8794408b81d7ae864ebfb2897cd596
    environment:
      RABBIT_URI: amqp://benchmark:${RABBIT_PASSWORD:?set generated hexadecimal password}@rabbit:5672/%2f
      RABBIT_QUEUE: ${CAPTURE_PREFIX:?set unique capture queue prefix}.official
      ARCHIVE_PATH: /archive/events.db
      JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError
    volumes:
      - type: bind
        source: ${ARCHIVE_DATA_DIR:?set existing local archive directory}
        target: /archive
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /archive/events.db && test -w /archive/events.db
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${ARCHIVE_NODE:?set storage node hostname}
      resources:
        limits:
          cpus: '2'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 60s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  prometheus:
    image: ghcr.io/timaday/wiremock-lab-prometheus@sha256:d673d2a0ecffb073bead7951776ab9fc6a8115a85e361981bd2f243ea0b21dff
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set -eu
        mkdir -p /tmp/wiremock
        cat > /tmp/wiremock/prometheus.yml <<'WIREMOCK_CONFIG_0'
        global:
          scrape_interval: 5s
          scrape_timeout: 4s
        scrape_configs:
          - job_name: wiremock
            metrics_path: /prometheus
            static_configs:
              - targets:
                  - official:8081
                labels:
                  runtime: official
          - job_name: rabbit
            static_configs:
              - targets:
                  - rabbit:15692
          - job_name: rabbit-queues
            metrics_path: /metrics/detailed
            params:
              family:
                - queue_coarse_metrics
                - queue_consumer_count
            static_configs:
              - targets:
                  - rabbit:15692

        WIREMOCK_CONFIG_0
        exec /bin/prometheus --config.file=/tmp/wiremock/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d --storage.tsdb.retention.size=2GB
    volumes:
      - type: bind
        source: ${PROMETHEUS_DATA_DIR:?set existing local metrics directory}
        target: /prometheus
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:9090/-/ready
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${MONITORING_NODE:?set monitoring node hostname}
      resources:
        limits:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first
    stop_grace_period: 60s
    networks:
      - capture
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    image: ghcr.io/timaday/wiremock-lab-grafana@sha256:b1ba4ee780745d9e19e53fcbea38ca128da3e8ce5ac28411542dc3b46f13ec35
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        set -eu
        mkdir -p /tmp/wiremock/provisioning/datasources
        cat > /tmp/wiremock/provisioning/datasources/prometheus.yml <<'WIREMOCK_CONFIG_0'
        apiVersion: 1
        datasources:
          - name: WireMock Prometheus
            uid: wiremock-prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 5s

        WIREMOCK_CONFIG_0
        mkdir -p /tmp/wiremock/provisioning/dashboards
        cat > /tmp/wiremock/provisioning/dashboards/direct.yml <<'WIREMOCK_CONFIG_1'
        apiVersion: 1
        providers:
          - name: Direct capture
            folder: WireMock
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /tmp/wiremock/dashboards

        WIREMOCK_CONFIG_1
        mkdir -p /tmp/wiremock/dashboards
        cat > /tmp/wiremock/dashboards/direct.json <<'WIREMOCK_CONFIG_2'
        {"uid": "wiremock-direct", "title": "WireMock official capture", "schemaVersion": 39, "version": 1, "tags": ["wiremock", "benchmark"], "editable": false, "refresh": "5s", "timezone": "browser", "time": {"from": "now-15m", "to": "now"}, "panels": [{"id": 1, "type": "text", "title": "Direct capture: HTTP \u2192 RabbitMQ \u2192 archive", "gridPos": {"x": 0, "y": 0, "w": 24, "h": 4}, "options": {"mode": "markdown", "content": "HTTP charts count capture-enabled mappings in STUB_JSON mode, or admitted `/bench/` requests in BENCHMARK_HEADERS mode. Duration includes the configured delay. Capture waiting events are awaiting broker confirmation, not a disk outbox. Expect three capture events per completed exchange after drain. Queue consumers and acknowledgements show archive-consumer activity; they do not prove reconciliation. Disk headroom is for RabbitMQ only. Archive disk, host swapping and container RSS are not measured. Missing data is not a healthy zero. No notification receiver is configured."}}, {"id": 2, "type": "timeseries", "title": "Completed HTTP requests / second", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(wiremock_http_completed_total{runtime=~\"$$runtime\"}[$$__rate_interval])", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "reqps", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 3, "type": "timeseries", "title": "Non-2xx responses / second", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(wiremock_http_errors_total{runtime=~\"$$runtime\"}[$$__rate_interval])", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "reqps", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 4, "type": "timeseries", "title": "Server duration p95 / p99 (includes delay)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (runtime, le) (rate(wiremock_http_duration_seconds_bucket{runtime=~\"$$runtime\"}[$$__rate_interval])))", "legendFormat": "{{runtime}} p95", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}, {"refId": "B", "expr": "histogram_quantile(0.99, sum by (runtime, le) (rate(wiremock_http_duration_seconds_bucket{runtime=~\"$$runtime\"}[$$__rate_interval])))", "legendFormat": "{{runtime}} p99", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 5, "type": "timeseries", "title": "Requests currently in flight", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_http_in_flight{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 6, "type": "timeseries", "title": "JVM heap used / maximum", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 20, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_jvm_heap_used_bytes{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}} used", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}, {"refId": "B", "expr": "wiremock_jvm_heap_max_bytes{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}} maximum", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "bytes", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 7, "type": "timeseries", "title": "JVM process CPU (1 = one core)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 20, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(wiremock_process_cpu_seconds_total{runtime=~\"$$runtime\"}[$$__rate_interval])", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 8, "type": "timeseries", "title": "GC time / second", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 28, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(wiremock_jvm_gc_seconds_total{runtime=~\"$$runtime\"}[$$__rate_interval])", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 9, "type": "timeseries", "title": "JVM live threads", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 28, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_jvm_threads{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 10, "type": "timeseries", "title": "Capture events awaiting broker confirmation", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 36, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_capture_pending{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 11, "type": "timeseries", "title": "Capture confirmed events / second", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 36, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rate(wiremock_capture_confirmed_total{runtime=~\"$$runtime\"}[$$__rate_interval])", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "ops", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 12, "type": "timeseries", "title": "Capture errors (since process start)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 44, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_capture_errors_total{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 13, "type": "timeseries", "title": "Capture broker connected (1 = connected)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 44, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_capture_broker_connected{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 14, "type": "timeseries", "title": "RabbitMQ queue ready / unacknowledged", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 52, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rabbitmq_detailed_queue_messages_ready", "legendFormat": "{{queue}} ready", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}, {"refId": "B", "expr": "rabbitmq_detailed_queue_messages_unacked", "legendFormat": "{{queue}} unacked", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 15, "type": "timeseries", "title": "Telemetry available (1 = up)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 52, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "up", "legendFormat": "{{job}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 16, "type": "timeseries", "title": "Missing server timing samples", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 60, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "wiremock_http_timing_missing_total{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 17, "type": "timeseries", "title": "Process uptime", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 12, "y": 60, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "time() - wiremock_process_start_time_seconds{runtime=~\"$$runtime\"}", "legendFormat": "{{runtime}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "s", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bottom", "calcs": ["lastNotNull"]}}}, {"id": 18, "type": "timeseries", "title": "Archive consumers (expected 1 per queue)", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}, "gridPos": {"x": 0, "y": 68, "w": 12, "h": 8}, "targets": [{"refId": "A", "expr": "rabbitmq_detailed_queue_consumers", "legendFormat": "{{queue}}", "datasource": {"type": "prometheus", "uid": "wiremock-prometheus"}}], "fieldConfig": {"defaults": {"unit": "short", "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 8}}, "overrides": []}, "options": {"legend": {"displayMode": "table", "placement": "bott