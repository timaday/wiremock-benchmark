version: "3.8"
services:
  injector:
    image: wiremock-benchmark-gatling:local
    entrypoint: [/bin/sh, /work/tests/start-engine.sh]
    environment:
      ENGINE_SLOT: "{{.Task.Slot}}"
      RUN_ID: ${RUN_NAMESPACE}
      BENCH_HOST: ${BENCH_HOST}
      ENGINE_RATE: ${ENGINE_RATE}
      LOAD_START_MS: ${LOAD_START_MS}
      MEASURE_END_MS: ${MEASURE_END_MS}
      HEAP: -Xms128m -Xmx1g
      JVM_ARGS: -Xss256k -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError
    volumes:
      - type: bind
        source: ${RESULTS_PATH}
        target: /results
    networks: [benchmark]
    stop_grace_period: 45s
    deploy:
      replicas: 4
      restart_policy: {condition: none}
      placement:
        constraints: ["node.id == ${BENCH_NODE}"]
      resources:
        limits: {cpus: '2.0', memory: 1792M}
networks:
  benchmark:
    external: true
    name: ${BENCH_NETWORK}
