{
  "protocolVersion": "2.0.0",
  "id": "ph-wiremock-headless-load-da0484c6",
  "name": "WireMock headless: PocketHive load",
  "description": "Finite six-second benchmark: 1020 offered requests/s; 91800 unique requests.",
  "template": {
    "image": "swarm-controller:latest",
    "bees": [
      {
        "role": "generator-0",
        "image": "generator:latest",
        "env": {
          "JAVA_TOOL_OPTIONS": "-Xms128m -Xmx512m"
        },
        "work": {
          "out": {
            "out": "requests-0"
          }
        },
        "ports": [
          {
            "id": "out",
            "direction": "out"
          }
        ],
        "config": {
          "historyPolicy": "FULL",
          "inputs": {
            "type": "CSV_DATASET",
            "csv": {
              "filePath": "/app/scenario/datasets/lane-0.csv",
              "ratePerSec": 255,
              "rotate": false,
              "skipHeader": true,
              "delimiter": ",",
              "charset": "UTF-8",
              "startupDelaySeconds": 10,
              "tickIntervalMs": 100
            }
          },
          "outputs": {
            "type": "ARTEMIS",
            "artemis": {
              "persistent": true
            }
          },
          "message": {
            "bodyType": "HTTP",
            "method": "POST",
            "path": "/bench/{{ payloadAsJson.caseId }}",
            "body": "{\"id\":\"{{ payloadAsJson.benchId }}\",\"padding\":\"{% if payloadAsJson.size == '1024' %}{% elseif payloadAsJson.size == '5120' %}{% elseif payloadAsJson.size == '10240' %}{% elseif payloadAsJson.size == '51200' %}{% endif %}\"}",
            "headers": {
              "Content-Type": "application/json",
              "X-Bench-Run": "da0484c6419f7645",
              "X-Bench-Id": "{{ payloadAsJson.benchId }}",
              "X-Bench-Offered-At": "{{ eval(\"nowIso\") }}"
            }
          }
        }
      },
      {
        "role": "processor-0",
        "image": "processor:latest",
        "env": {
          "JAVA_TOOL_OPTIONS": "-Xms256m -Xmx1g -Xss256k"
        },
        "work": {
          "in": {
            "in": "requests-0"
          },
          "out": {
            "out": "results"
          }
        },
        "ports": [
          {
            "id": "in",
            "direction": "in"
          },
          {
            "id": "out",
            "direction": "out"
          }
        ],
        "config": {
          "baseUrl": "{{ sut.endpoints['default'].baseUrl }}",
          "mode": "RATE_PER_SEC",
          "ratePerSec": 255,
          "threadCount": 1800,
          "connectionReuse": "PER_THREAD",
          "keepAlive": true,
          "timeoutMs": 30000,
          "sslVerify": true,
