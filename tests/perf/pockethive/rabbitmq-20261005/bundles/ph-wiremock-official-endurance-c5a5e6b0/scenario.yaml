  - role: evidence
    image: moderator:latest
    env:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    work:
      in:
        in: results
    ports:
    - id: in
      direction: in
    config:
      mode:
        type: pass-through
        ratePerSec: 0
      inputs:
        type: RABBITMQ
        rabbit:
          prefetch: 50
          concurrentConsumers: 1
          exclusive: false
      outputs:
        type: REDIS
        redis:
          host: wmb-ph-results
          port: 6379
          sourceStep: LAST
          pushDirection: RPUSH
          routes: []
          targetListTemplate: ''
          defaultList: wmb.c5a5e6b00b2ff13f
          maxLen: -1
          ssl: false
      historyPolicy: LATEST_ONLY
      interceptors:
        templating:
          template: '{% set result = payload %}{% set payload = workItem.steps[1].payload
            %}{"bench_id":"{{ eval("#json_path(payload, ''/request/headers/X-Bench-Id'')")
