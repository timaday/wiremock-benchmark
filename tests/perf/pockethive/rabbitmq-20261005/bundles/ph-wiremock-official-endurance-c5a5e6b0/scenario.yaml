protocolVersion: 2.0.0
id: ph-wiremock-official-endurance-c5a5e6b0
name: 'WireMock official: PocketHive RabbitMQ endurance'
description: 'Finite six-second benchmark: 1020 offered requests/s; 3763800 unique
  requests.'
template:
  image: swarm-controller:latest
  bees:
  - role: generator-0
    image: generator:latest
    env:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx512m
    work:
      out:
        out: requests-0
    ports:
    - id: out
      direction: out
    config:
      historyPolicy: FULL
      inputs:
        type: CSV_DATASET
        csv:
          filePath: /app/scenario/datasets/shared.csv
          ratePerSec: 255
          rotate: false
          skipHeader: true
          delimiter: ','
          charset: UTF-8
          startupDelaySeconds: 10
          tickIntervalMs: 100
      outputs:
        type: RABBITMQ
        rabbit:
          persistent: true
          publisherConfirms: false
      message:
        bodyType: HTTP
        method: POST
        path: /bench/{{ payloadAsJson.caseId }}
        body: '{"id":"c5a5e6b00b2ff13f-00{{ payloadAsJson.sequence }}","padding":"{%
          if payloadAsJson.size == ''1024'' %}{%
          elseif payloadAsJson.size == ''5120'' %}{%
          elseif payloadAsJson.size == ''10240'' %}{%
          elseif payloadAsJson.size == ''51200'' %}{%
          endif %}"}'
        headers:
          Content-Type: application/json
          X-Bench-Run: c5a5e6b00b2ff13f
          X-Bench-Id: c5a5e6b00b2ff13f-00{{ payloadAsJson.sequence }}
          X-Bench-Offered-At: '{{ eval("nowIso") }}'
  - role: processor-0
    image: processor:latest
    env:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g -Xss256k
    work:
      in:
        in: requests-0
      out:
        out: results
    ports:
    - id: in
      direction: in
    - id: out
      direction: out
    config:
      baseUrl: '{{ sut.endpoints[''default''].baseUrl }}'
      mode: RATE_PER_SEC
      ratePerSec: 255
      threadCount: 1800
      connectionReuse: PER_THREAD
      keepAlive: true
      timeoutMs: 30000
      sslVerify: true
      historyPolicy: FULL
      inputs:
        type: RABBITMQ
        rabbit:
          prefetch: 50
          concurrentConsumers: 1
          exclusive: false
      outputs:
        type: RABBITMQ
        rabbit:
          persistent: true
          publisherConfirms: false
